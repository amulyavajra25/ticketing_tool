<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login - Helpdesk</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-950 text-gray-100 flex items-center justify-center h-screen">
    <div class="bg-gray-900 border border-gray-800 p-8 rounded-lg shadow-xl w-96">
        <h2 class="text-2xl font-bold text-blue-500 mb-6 text-center">Helpdesk Login</h2>
        
        {% if error %}
            <p class="bg-red-500/20 border border-red-500 text-red-300 p-2 rounded mb-4 text-sm">{{ error }}</p>
        {% endif %}

        <form method="POST" class="space-y-4">
            <div>
                <label class="block text-sm text-gray-400 mb-1">Email Address</label>
                <input type="email" name="email" required class="w-full bg-gray-950 border border-gray-700 rounded px-3 py-2 text-white focus:outline-none focus:border-blue-500">
            </div>
            <div>
                <label class="block text-sm text-gray-400 mb-1">Password</label>
                <input type="password" name="password" required class="w-full bg-gray-950 border border-gray-700 rounded px-3 py-2 text-white focus:outline-none focus:border-blue-500">
            </div>
            <button type="submit" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-semibold py-2 rounded transition">Login</button>
        </form>

        <div class="text-center mt-4">
            <p class="text-sm text-gray-400">
                Don't have an account? <a href="{{ url_for('register') }}" class="text-blue-400 hover:underline">Register</a>
            </p>
            <div class="mt-4 pt-3 border-t border-gray-800 text-xs text-left text-gray-400">
                <p class="font-semibold text-gray-300 mb-1">Demo Accounts:</p>
                <p><span class="text-gray-500">Admin:</span> mani@helpdesk.com / admin123</p>
                <p><span class="text-gray-500">Employee:</span> amulya@helpdesk.com / emp123</p>
                <p><span class="text-gray-500">Client:</span> client1@gmail.com / client123</p>
            </div>
        </div>
    </div>
</body>
</html>
